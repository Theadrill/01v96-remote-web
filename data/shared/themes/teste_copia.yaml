global:
  bg_overlay: rgba(0, 0, 0, 0.85)
confirm_modal:
  bg_content: '#1a1a1a'
  border_color: '#333'
  border_radius: 12px
  padding: 24px
  max_width: 380px
  text_primary: '#fff'
  text_secondary: '#ccc'
  text_muted: '#888'
  btn_primary: '#28a745'
  btn_danger: '#34495e'
  btn_warning: '#ffc107'
  btn_info: '#1976d2'
  btn_secondary: '#2b2b2b'
  btn_height: 44px
  btn_radius: 8px
  btn_gap: 10px
  btn_font_weight: '800'
  btn_letter_spacing: 0.5px
  icon_danger_color: '#dc3545'
  icon_warning_color: '#ffc107'
  icon_info_color: '#1976d2'
  icon_success_color: '#28a745'
  icon_size: 24px
  z_index: '999999'
virtual_keyboard:
  key_bg: '#333'
  key_border: '1px solid #555'
  key_color: '#fff'
  key_height: 40px
  key_radius: 6px
  key_font_size: 16px
  key_font_weight: bold
  backspace_bg: '#c62828'
  backspace_border: '1px solid #e53935'
  space_font_size: 14px
  row_gap: 4px
  keyboard_gap: 4px
