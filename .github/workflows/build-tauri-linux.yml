name: Build Tauri Client (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Tauri App
        run: cargo tauri build --bundles appimage,deb

      - name: Prepare Standalone Binary
        run: |
          mkdir -p target/release/standalone
          if [ -f target/release/app ]; then
            cp target/release/app target/release/standalone/01v96-remote-client
            chmod +x target/release/standalone/01v96-remote-client
          fi
          if [ -f src-tauri/target/release/app ]; then
            cp src-tauri/target/release/app target/release/standalone/01v96-remote-client
            chmod +x target/release/standalone/01v96-remote-client
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 01v96-remote-client-linux
          path: |
            target/release/standalone/01v96-remote-client
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: warn
