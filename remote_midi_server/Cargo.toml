[package]
name = "remote_midi_server"
version = "0.1.0"
edition = "2024"

[dependencies]
midi_common = { path = "../midi_common" }
midir = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = "0.24.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
image = "0.25.10"
