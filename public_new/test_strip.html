<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual - ChannelStripComponent (Custom Element v2)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100vh;
            box-sizing: border-box;
            overflow: auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #18181b;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .header-title {
            color: #00e676;
            margin: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-switcher {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .switch-btn {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .switch-btn.active {
            background: #00e676;
            color: #000000;
            border-color: #00e676;
        }

        .section-desc {
            font-size: 13px;
            color: #8d8d99;
            margin: 0;
        }
    </style>
</head>
<body class="layout-desktop-mode">
    <div class="header-bar">
        <div>
            <h1 class="header-title">🎛️ Teste Visual de Estados e Presets do &lt;channel-strip&gt; (v2)</h1>
            <p class="section-desc">Validação completa: Escala de dB lateral, VU meters estéreo, indicador e arraste de Pan, rodapé de Patch colorido e chaveamento Desktop / Mobile.</p>
        </div>
        <div class="view-switcher">
            <button id="btnViewDesktop" class="switch-btn active" onclick="switchLayout('desktop')">🖥️ DESKTOP</button>
            <button id="btnViewMobile" class="switch-btn" onclick="switchLayout('mobile')">📱 MOBILE</button>
        </div>
    </div>

    <div class="strips-row" id="stripsContainer">
        <!-- 1. Canal Normal Ativado (CH 6 - CAVACO) -->
        <channel-strip id="strip1" data-ch="5" preset="input" patch="AD 6" pan="-20" layout="desktop"></channel-strip>

        <!-- 2. Canal Desativado / Mute (ON = false) (CH 7) -->
        <channel-strip id="strip2" data-ch="6" preset="input" patch="AD 7" pan="0" layout="desktop"></channel-strip>

        <!-- 3. Canal Estéreo Pareado (CH 21 + 22 - LR) -->
        <channel-strip id="strip3" data-ch="20" preset="input" data-partner-ch="21" patch="ADAT 7" pan="0" layout="desktop"></channel-strip>

        <!-- 4. Canal Disabled (CH 18 - Grupo 2) -->
        <channel-strip id="strip4" data-ch="17" preset="input" patch="AD 18" pan="15" disabled layout="desktop"></channel-strip>

        <!-- 5. Canal Locked / Travado (CH 19 - Grupo 2) -->
        <channel-strip id="strip5" data-ch="18" preset="input" patch="AD 19" pan="0" locked layout="desktop"></channel-strip>

        <!-- 6. ST IN Estéreo (CH 60/61) -->
        <channel-strip id="strip6" data-ch="60" preset="input" data-partner-ch="61" patch="ST IN 1" pan="0" layout="desktop"></channel-strip>

        <!-- 7. AUX / MIX (CH 36) -->
        <channel-strip id="strip7" data-ch="36" preset="output" patch="MIX 1" pan="0" layout="desktop"></channel-strip>

        <!-- 8. BUS Output (CH 44) -->
        <channel-strip id="strip8" data-ch="44" preset="output" patch="BUS 1" pan="0" layout="desktop"></channel-strip>

        <!-- 9. AUX SEND com PRE/POST (POST desativado - cinza) -->
        <channel-strip id="stripAux1" data-ch="0" preset="auxSend" data-aux-idx="1" pre-post="post" patch="AUX 1" pan="0" layout="desktop"></channel-strip>

        <!-- 10. AUX SEND com PRE/POST (PRE ativado - roxo) -->
        <channel-strip id="stripAux2" data-ch="1" preset="auxSend" data-aux-idx="2" pre-post="pre" patch="AUX 2" pan="0" layout="desktop"></channel-strip>

        <!-- 11. MASTER Estéreo (CH 52 - Fundo avermelhado e Header cinza padrão) -->
        <channel-strip id="strip9" data-ch="52" preset="master" data-partner-ch="53" layout="desktop"></channel-strip>
    </div>

    <!-- Módulo de Simulação e Controle do Teste -->
    <script src="modules/bubble-modal.js"></script>
    <script type="module">
        import './modules/channel_strip_component.js';
        import { MeterBus } from './modules/meter-bus.js';

        // Alternância de Layout Desktop / Mobile
        window.switchLayout = function(mode) {
            document.body.className = mode === 'desktop' ? 'layout-desktop-mode' : 'layout-mobile-mode';
            document.getElementById('btnViewDesktop').classList.toggle('active', mode === 'desktop');
            document.getElementById('btnViewMobile').classList.toggle('active', mode === 'mobile');

            document.querySelectorAll('channel-strip').forEach(strip => {
                strip.setAttribute('layout', mode);
            });
        };

        // Inicialização de canais do teste
        const strip1 = document.getElementById('strip1');
        if (strip1) {
            strip1.name = 'CAVACO';
            strip1.on = true;
            strip1.value = 0; // -inf dB
        }

        const strip2 = document.getElementById('strip2');
        if (strip2) {
            strip2.name = 'VIOLAO';
            strip2.on = false; // Mute
            strip2.value = 750; // -5 dB
        }

        const strip3 = document.getElementById('strip3');
        if (strip3) {
            strip3.name = 'LR';
            strip3.on = true;
            strip3.value = 890; // +5.5 dB
        }

        const strip4 = document.getElementById('strip4');
        if (strip4) {
            strip4.name = 'BUMBO';
            strip4.on = true;
            strip4.value = 600;
        }

        const strip5 = document.getElementById('strip5');
        if (strip5) {
            strip5.name = 'CAIXA';
            strip5.on = true;
            strip5.value = 823; // 0 dB
        }

        const stripAux1 = document.getElementById('stripAux1');
        if (stripAux1) {
            stripAux1.name = 'SEND 1';
            stripAux1.on = true;
            stripAux1.value = 700;
        }

        const stripAux2 = document.getElementById('stripAux2');
        if (stripAux2) {
            stripAux2.name = 'SEND 2';
            stripAux2.on = true;
            stripAux2.value = 823;
        }

        const strip9 = document.getElementById('strip9');
        if (strip9) {
            strip9.name = 'STEREO';
            strip9.on = false; // Começa desligado (fundo #3d1a1a e header cinza #2b2b2b)
            strip9.value = 823;
        }

        // Simulação de Níveis a 60 FPS via MeterBus
        const wasmMem = new Float32Array(80);
        let phase = 0;

        function simulate() {
            phase += 0.04;

            // Simula níveis para os canais
            wasmMem[5] = Math.max(0, (Math.sin(phase) + 1) * 45);        // CH 6 (CAVACO)
            wasmMem[6] = Math.max(0, (Math.cos(phase * 0.8) + 1) * 30);  // CH 7 (VIOLAO)
            wasmMem[20] = Math.max(0, (Math.sin(phase * 1.2) + 1) * 48); // CH 21 L (LR)
            wasmMem[21] = Math.max(0, (Math.cos(phase * 1.1) + 1) * 46); // CH 22 R (LR)
            wasmMem[17] = Math.max(0, (Math.sin(phase * 0.5) + 1) * 20); // CH 18 (Disabled)
            wasmMem[18] = Math.max(0, (Math.sin(phase * 0.6) + 1) * 35); // CH 19 (Locked)
            wasmMem[60] = Math.max(0, (Math.sin(phase * 1.3) + 1) * 42); // ST IN 1L
            wasmMem[61] = Math.max(0, (Math.cos(phase * 1.4) + 1) * 44); // ST IN 1R
            wasmMem[36] = Math.max(0, (Math.sin(phase * 0.7) + 1) * 35); // MIX 1
            wasmMem[44] = Math.max(0, (Math.cos(phase * 0.9) + 1) * 38); // BUS 1
            wasmMem[52] = Math.max(0, (Math.sin(phase * 1.5) + 1) * 49); // MASTER L
            wasmMem[53] = Math.max(0, (Math.cos(phase * 1.5) + 1) * 48); // MASTER R

            MeterBus.frame(wasmMem, performance.now());
            requestAnimationFrame(simulate);
        }

        requestAnimationFrame(simulate);
    </script>
</body>
</html>
