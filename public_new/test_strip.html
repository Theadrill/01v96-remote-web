<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual - ChannelStripComponent (Custom Element v2)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100vh;
            box-sizing: border-box;
            overflow: auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #18181b;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #27272a;
        }

        .header-title {
            color: #00e676;
            margin: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-switcher {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .switch-btn {
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .switch-btn.active {
            background: #00e676;
            color: #000000;
            border-color: #00e676;
        }

        .section-desc {
            font-size: 13px;
            color: #8d8d99;
            margin: 0;
        }
    </style>
</head>
<body class="layout-desktop-mode">
    <div class="header-bar">
        <div>
            <h1 class="header-title">🎛️ Teste Visual de Estados e Presets do &lt;channel-strip&gt; (v2)</h1>
            <p class="section-desc">Validação completa: Escala de dB lateral, VU meters estéreo, indicador e arraste de Pan, rodapé de Patch colorido e chaveamento Desktop / Mobile.</p>
        </div>
        <div class="view-switcher">
            <button id="btnViewDesktop" class="switch-btn active" onclick="switchLayout('desktop')">🖥️ DESKTOP</button>
            <button id="btnViewMobile" class="switch-btn" onclick="switchLayout('mobile')">📱 MOBILE</button>
        </div>
    </div>

    <div class="strips-row" id="stripsContainer">
        <!-- 1. Canal Normal Ativado (CH 6 - CAVACO) -->
        <channel-strip id="strip1" data-ch="5" preset="input" patch="AD 6" pan="-20" layout="desktop"></channel-strip>

        <!-- 2. Canal Desativado / Mute (ON = false) (CH 7) -->
        <channel-strip id="strip2" data-ch="6" preset="input" patch="AD 7" pan="0" layout="desktop"></channel-strip>

        <!-- 3. Canal Estéreo Pareado (CH 21 + 22 - LR) -->
        <channel-strip id="strip3" data-ch="20" preset="input" data-partner-ch="21" patch="ADAT 7" pan="0" layout="desktop"></channel-strip>

        <!-- 4. Canal Disabled (CH 18 - Grupo 2) -->
        <channel-strip id="strip4" data-ch="17" preset="input" patch="AD 18" pan="15" disabled layout="desktop"></channel-strip>

        <!-- 5. Canal Locked / Travado (CH 19 - Grupo 2) -->
        <channel-strip id="strip5" data-ch="18" preset="input" patch="AD 19" pan="0" locked layout="desktop"></channel-strip>

        <!-- 6. ST IN Estéreo (CH 60/61) -->
        <channel-strip id="strip6" data-ch="60" preset="input" data-partner-ch="61" patch="ST IN 1" pan="0" layout="desktop"></channel-strip>

        <!-- 7. AUX / MIX (CH 36) -->
        <channel-strip id="strip7" data-ch="36" preset="output" patch="MIX 1" pan="0" layout="desktop"></channel-strip>

        <!-- 8. BUS Output (CH 44) -->
        <channel-strip id="strip8" data-ch="44" preset="output" patch="BUS 1" pan="0" layout="desktop"></channel-strip>

        <!-- 9. AUX SEND com PRE/POST (POST desativado - cinza) -->
        <channel-strip id="stripAux1" data-ch="0" preset="auxSend" data-aux-idx="1" pre-post="post" patch="AUX 1" pan="0" layout="desktop"></channel-strip>

        <!-- 10. AUX SEND com PRE/POST (PRE ativado - roxo) -->
        <channel-strip id="stripAux2" data-ch="1" preset="auxSend" data-aux-idx="2" pre-post="pre" patch="AUX 2" pan="0" layout="desktop"></channel-strip>

        <!-- 11. MASTER Estéreo (CH 52 - Fundo avermelhado e Header cinza padrão) -->
        <channel-strip id="strip9" data-ch="52" preset="master" data-partner-ch="53" layout="desktop"></channel-strip>

        <!-- 12. MACRO FADER Padrão (com botão CONFIG e Delta dB) -->
        <channel-strip id="stripMacro1" preset="macro" show-config layout="desktop"></channel-strip>

        <!-- 13. VOLUME GERAL Padrão -->
        <channel-strip id="stripVG1" preset="volumeGeral" layout="desktop"></channel-strip>

        <!-- 14. VOLUME GERAL Modo Músico (com CONFIG de Canais Protegidos) -->
        <channel-strip id="stripVGMusician" preset="volumeGeral" musician-mode layout="desktop"></channel-strip>

        <!-- 15. AUX GERAL Compacto (Subaba / Envio individual com ZERAR) -->
        <channel-strip id="stripAuxVG" preset="auxVolumeGeral" data-ch="5" compact layout="desktop"></channel-strip>
    </div>

    <!-- Módulo de Simulação e Controle do Teste -->
    <script src="modules/bubble-modal.js"></script>
    <script src="modules/confirm-modal.js"></script>
    <script src="modules/channel_lock.js"></script>
    <script type="module">
        import './modules/channel_strip_component.js';
        import { MeterBus } from './modules/meter-bus.js';

        // Simulação do array global de canais travados no teste
        window.lockedChannels = ['CH19'];

        // Mock de socket para testar eventos de lock e controle sem servidor
        if (!window.socket) {
            window.socket = {
                connected: true,
                emit: (evt, data) => {
                    console.log(`[Socket Mock emit] ${evt}:`, data);
                    if (evt === 'toggle_channel_lock' && data && data.channel) {
                        const idx = window.lockedChannels.indexOf(data.channel);
                        if (idx >= 0) {
                            window.lockedChannels.splice(idx, 1);
                        } else {
                            window.lockedChannels.push(data.channel);
                        }
                        if (typeof window.updateLockedChannelsUI === 'function') {
                            window.updateLockedChannelsUI();
                        }
                    }
                },
                on: () => {},
                off: () => {}
            };
        }

        // Mock de resolvedNames / uiState.resolvedNames com nomes reais de palco
        const testChannelNames = {
            0: { name: 'BUMBO', short: 'BUMBO' },
            1: { name: 'CAIXA', short: 'CAIXA' },
            2: { name: 'CHIMBAL', short: 'CHIMBAL' },
            3: { name: 'TOM 1', short: 'TOM 1' },
            4: { name: 'SURDO', short: 'SURDO' },
            5: { name: 'CAVACO', short: 'CAVACO' },
            6: { name: 'VIOLAO', short: 'VIOLAO' },
            7: { name: 'GUITARRA', short: 'GUITAR' },
            8: { name: 'BAIXO', short: 'BAIXO' },
            9: { name: 'TECLADO L', short: 'TEC L' },
            10: { name: 'TECLADO R', short: 'TEC R' },
            11: { name: 'VOZ 1', short: 'VOZ 1' },
            12: { name: 'VOZ 2', short: 'VOZ 2' },
            13: { name: 'BACKING', short: 'BACK' },
            14: { name: 'PERC 1', short: 'PERC 1' },
            15: { name: 'PERC 2', short: 'PERC 2' },
            16: { name: 'OVER L', short: 'OVR L' },
            17: { name: 'OVER R', short: 'OVR R' },
            18: { name: 'PAD L', short: 'PAD L' },
            19: { name: 'PAD R', short: 'PAD R' },
            20: { name: 'LR L', short: 'LR L' },
            21: { name: 'LR R', short: 'LR R' },
            22: { name: 'CH 23', short: 'CH 23' },
            23: { name: 'CH 24', short: 'CH 24' },
            24: { name: 'CH 25', short: 'CH 25' },
            25: { name: 'CH 26', short: 'CH 26' },
            26: { name: 'CH 27', short: 'CH 27' },
            27: { name: 'CH 28', short: 'CH 28' },
            28: { name: 'CH 29', short: 'CH 29' },
            29: { name: 'CH 30', short: 'CH 30' },
            30: { name: 'TALKBACK', short: 'TB' },
            31: { name: 'PLAYBACK', short: 'PLAY' }
        };

        window.resolvedNames = Object.assign(window.resolvedNames || {}, testChannelNames);
        if (typeof window.channelStates !== 'undefined') {
            for (let i = 0; i < 32; i++) {
                if (window.channelStates[i] && testChannelNames[i]) {
                    window.channelStates[i].name = testChannelNames[i].name;
                }
            }
        }

        // Alternância de Layout Desktop / Mobile
        window.switchLayout = function(mode) {
            document.body.className = mode === 'desktop' ? 'layout-desktop-mode' : 'layout-mobile-mode';
            document.getElementById('btnViewDesktop').classList.toggle('active', mode === 'desktop');
            document.getElementById('btnViewMobile').classList.toggle('active', mode === 'mobile');

            document.querySelectorAll('channel-strip').forEach(strip => {
                strip.setAttribute('layout', mode);
            });
        };

        // Inicialização de canais do teste
        const strip1 = document.getElementById('strip1');
        if (strip1) {
            strip1.name = 'CAVACO';
            strip1.on = true;
            strip1.value = 0; // -inf dB
        }

        const strip2 = document.getElementById('strip2');
        if (strip2) {
            strip2.name = 'VIOLAO';
            strip2.on = false; // Mute
            strip2.value = 750; // -5 dB
        }

        const strip3 = document.getElementById('strip3');
        if (strip3) {
            strip3.name = 'LR';
            strip3.on = true;
            strip3.value = 890; // +5.5 dB
        }

        const strip4 = document.getElementById('strip4');
        if (strip4) {
            strip4.name = 'BUMBO';
            strip4.on = true;
            strip4.value = 600;
        }

        const strip5 = document.getElementById('strip5');
        if (strip5) {
            strip5.name = 'CAIXA';
            strip5.on = true;
            strip5.value = 823; // 0 dB
        }

        const stripAux1 = document.getElementById('stripAux1');
        if (stripAux1) {
            stripAux1.name = 'SEND 1';
            stripAux1.on = true;
            stripAux1.value = 700;
        }

        const stripAux2 = document.getElementById('stripAux2');
        if (stripAux2) {
            stripAux2.name = 'SEND 2';
            stripAux2.on = true;
            stripAux2.value = 823;
        }

        const strip9 = document.getElementById('strip9');
        if (strip9) {
            strip9.name = 'STEREO';
            strip9.on = false; // Começa desligado (fundo #3d1a1a e header cinza #2b2b2b)
            strip9.value = 823;
        }

        // Simulação de Níveis a 60 FPS via MeterBus
        const wasmMem = new Float32Array(80);
        let phase = 0;

        function simulate() {
            phase += 0.04;

            // Simula níveis suaves (0 a 100%) para os canais
            // CH 6 (CAVACO): oscila normalmente até ~90%, com pico real suave em 100% no topo da senoide
            const cavacoWave = (Math.sin(phase) + 1) / 2; // 0.0 a 1.0
            wasmMem[5] = cavacoWave > 0.96 ? 100 : (cavacoWave * 92);

            wasmMem[6] = Math.max(0, (Math.cos(phase * 0.8) + 1) * 35);  // CH 7 (VIOLAO)

            // CH 21 + 22 (LR Pareado): oscila com dinamismo estéreo e atinge pico suave alternado em L e R
            const lrWaveL = (Math.sin(phase * 1.2) + 1) / 2;
            const lrWaveR = (Math.cos(phase * 1.1) + 1) / 2;
            wasmMem[20] = lrWaveL > 0.95 ? 100 : (lrWaveL * 92);
            wasmMem[21] = lrWaveR > 0.95 ? 100 : (lrWaveR * 92);

            wasmMem[17] = Math.max(0, (Math.sin(phase * 0.5) + 1) * 20); // CH 18 (Disabled)
            wasmMem[18] = Math.max(0, (Math.sin(phase * 0.6) + 1) * 35); // CH 19 (Locked)
            // ST IN 1 Estéreo (CH 60 / 61): oscila com dinamismo estéreo e pico alternado em L e R
            const stWaveL = (Math.sin(phase * 1.3) + 1) / 2;
            const stWaveR = (Math.cos(phase * 1.4) + 1) / 2;
            wasmMem[60] = stWaveL > 0.95 ? 100 : (stWaveL * 92); // ST IN 1L
            wasmMem[61] = stWaveR > 0.95 ? 100 : (stWaveR * 92); // ST IN 1R

            wasmMem[36] = Math.max(0, (Math.sin(phase * 0.7) + 1) * 35); // MIX 1
            wasmMem[44] = Math.max(0, (Math.cos(phase * 0.9) + 1) * 38); // BUS 1

            // MASTER (CH 52 / 53 Estéreo): oscila com dinamismo estéreo e pico alternado em L e R
            const masterWaveL = (Math.sin(phase * 1.5) + 1) / 2;
            const masterWaveR = (Math.cos(phase * 1.6) + 1) / 2;
            wasmMem[52] = masterWaveL > 0.95 ? 100 : (masterWaveL * 92); // MASTER L
            wasmMem[53] = masterWaveR > 0.95 ? 100 : (masterWaveR * 92); // MASTER R

            MeterBus.frame(wasmMem, performance.now());
            requestAnimationFrame(simulate);
        }

        requestAnimationFrame(simulate);
    </script>
</body>
</html>
