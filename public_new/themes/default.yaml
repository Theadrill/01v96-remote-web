# ════════════════════════════════════════════════════════════════
# TEMA GLOBAL — 01V96 Remote Web
# ════════════════════════════════════════════════════════════════
#
# Este arquivo define TODAS as variáveis CSS do projeto.
# Para criar um novo tema, copie este arquivo, renomeie e edite.
#
# Estrutura por componente:
#   - confirm_modal: Modal de confirmação reutilizável
#   - sidebar:       Sidebar de navegação (futuro)
#   - faders:        Área de faders (futuro)
#   - header:        Cabeçalho (futuro)
#   - eq:            Equalizador (futuro)
#   - dynamics:      Gate/Compressor (futuro)
#
# Adicione novos componentes conforme forem sendo refatorados.
# ════════════════════════════════════════════════════════════════
# ENDOFDESCRIPTION


# ─── OVERLAY GLOBAL ───────────────────────────────────────────
# Usado por todos os modais do sistema
global:
  bg_overlay: "rgba(0, 0, 0, 0.85)"


# ─── CONFIRM MODAL ────────────────────────────────────────────
# Modal de confirmação reutilizável (ConfirmModal)
# Uso: ConfirmModal.show({ title, message, type })
confirm_modal:
  # Fundo do card
  bg_content: "#1a1a1a"
  border_color: "#333"
  border_radius: "12px"
  padding: "24px"
  max_width: "380px"

  # Tipografia
  text_primary: "#fff"
  text_secondary: "#ccc"
  text_muted: "#888"

  # Botões - Cores
  btn_primary: "#28a745"      # verde - ação positiva (SIM, CONFIRMAR)
  btn_danger: "#dc3545"       # vermelho - ação destrutiva (DELETAR)
  btn_warning: "#ffc107"      # amarelo - atenção
  btn_info: "#1976d2"         # azul - informativo
  btn_secondary: "#2b2b2b"    # cinza escuro - cancelar/voltar

  # Botões - Dimensões
  btn_height: "44px"
  btn_radius: "8px"
  btn_gap: "10px"
  btn_font_weight: "800"
  btn_letter_spacing: "0.5px"

  # Ícones
  icon_danger_color: "#dc3545"
  icon_warning_color: "#ffc107"
  icon_info_color: "#1976d2"
  icon_success_color: "#28a745"
  icon_size: "24px"

  # Z-index (sempre alto pois é última etapa do fluxo)
  z_index: "999999"


# ─── VIRTUAL KEYBOARD ─────────────────────────────────────────
# Teclado virtual reutilizável
# Uso: VirtualKeyboard.create(targetInputId) → HTMLElement
virtual_keyboard:
  # Teclas
  key_bg: "#333"
  key_border: "1px solid #555"
  key_color: "#fff"
  key_height: "40px"
  key_radius: "6px"
  key_font_size: "16px"
  key_font_weight: "bold"

  # Backspace
  backspace_bg: "#c62828"
  backspace_border: "1px solid #e53935"

  # Espaço
  space_font_size: "14px"

  # Layout
  row_gap: "4px"
  keyboard_gap: "4px"


# ─── FUTUROS COMPONENTES ──────────────────────────────────────
# Adicione novas seções conforme refatorar:
#
# sidebar:
#   ...
#
# faders:
#   ...
#
# prompt_modal:       # Modal de prompt (input)
#   ...
#
# alert_modal:        # Modal de alerta (só OK)
#   ...

# ─── BUBBLE MODAL ────────────────────────────────────────
# Balão de aviso/dica contextual
bubble_modal:
  bg_color: "#1e293b"
  border_color: "#3b82f6"
  border_radius: "8px"
  text_color: "#f8fafc"
  font_size: "13px"
  padding: "10px 14px"
  shadow: "0 10px 25px -5px rgba(0, 0, 0, 0.5)"
  z_index: "999999"
  arrow_color: "#3b82f6"
  duration: 5000 # Duração de exibição do balão em ms (ex: 5000 = 5s)
  delay: 300 # Tempo de espera em ms antes de exibir o balão (compatível com tempo de duplo clique)

# ─── CHANNEL LOCK ─────────────────────────────────────────────
# Overlay visual e comportamento de bloqueio de canal (channel_lock.js)
channel_lock:
  hold_duration_ms: 450      # Tempo em milissegundos pressionado para abrir o modal de lock (reduzido para UX mais ágil)
  z_index: 100                 # Camada de profundidade da sobreposição do lock
  icon_class: "fas fa-lock"     # Classe do ícone FontAwesome
  overlay_bg: "rgba(0, 0, 0, 0.30)"
  overlay_backdrop_filter: "blur(2px)"
  icon_color: "#000000"
  icon_size: "32px"
  border_locked: "1px solid #ff4444"
  border_color: "#ff4444"
  badge_bg: "#ff4444"
  badge_text_color: "#ffffff"

# ─── CHANNEL STRIP (Faders / Cards) ───────────────────────────
# Custom Element <channel-strip> (Light DOM v2)
channel_strip:
  # Dimensões e Estrutura do Card
  width_desktop: "86px"
  min_width_desktop: "86px"
  max_width_desktop: "86px"
  border_radius: "0px"
  border_color: "#111111"
  border_width: "1px"
  card_bg: "#222222"
  card_bg_on_g1: "#1a2633"                  # Azul escuro sutil no corpo do canal ON (G1)
  card_bg_on_g2: "#1a2b22"                  # Verde escuro sutil no corpo do canal ON (G2)
  card_bg_on: "#1a2633"                     # Fundo quando ON
  card_bg_master: "#3d1a1a"                 # Fundo repouso do Master Desktop
  card_bg_master_on: "#5d1a1a"              # Fundo ON do Master Desktop
  card_bg_master_mobile: "rgba(100, 0, 0, 0.9)" # Fundo do Master Mobile
  border_master_mobile: "#880000"           # Borda do Master Mobile
  border_top_g1: "#00adef"                  # Borda superior e inferior do G1 (Inputs 1-16)
  border_top_g2: "#00ff88"                  # Borda superior e inferior do G2 (Inputs 17-32)
  border_top_st: "#4a90e2"                  # Borda ST IN
  border_top_mix: "#d4a017"                 # Borda MIX
  border_top_bus: "#00b396"                 # Borda BUS
  border_top_master: "#ff4444"              # Borda Master
  padding: "0px"
  gap: "0px"

  # Header / Label (Número do Canal no topo)
  header_font_size: "11px"
  header_font_weight: "800"
  header_height: "26px"
  header_radius: "0px"
  header_text_color_g1: "#00adef"
  header_bg_input_g1_off: "#003a5e"         # Azul Slate sutil para OFF (G1)
  header_bg_input_g1_on: "#00568a"          # Azul denso para ON (G1)
  header_text_color_g2: "#00ff88"
  header_bg_input_g2_off: "#004a30"         # Verde Slate sutil para OFF (G2)
  header_bg_input_g2_on: "#006b41"          # Verde denso para ON (G2)
  header_bg_input: "#003a5e"
  header_text_color: "#00adef"
  header_bg_st_in: "#14283d"
  header_text_st_in: "#5cacee"
  header_bg_aux: "#332800"
  header_text_aux: "#ffcc00"
  header_bg_bus: "#002e27"
  header_text_bus: "#00ffcc"
  header_bg_master: "#2b2b2b"               # Cinza escuro por padrão (igual UI original)
  header_text_master: "#888888"             # Cinza médio por padrão
  header_bg_master_on: "#4a1c1c"            # Avermelhado quando selecionado
  header_text_master_on: "#ff8080"

  # Visor LCD de Nome (Display verde/customizado)
  name_display_bg: "#000000"
  name_display_border: "#333333"
  name_display_text_color: "#00ff00"         # Verde brilhante Yamaha (#0f0)
  name_display_font_size: "11px"
  name_display_font_weight: "bold"
  name_display_font_family: "monospace"
  name_display_height: "32px"
  name_display_radius: "4px"

  # Botão SOLO (CUE)
  btn_solo_bg: "#333333"
  btn_solo_text_color: "#888888"
  btn_solo_border: "#444444"
  btn_solo_active_bg: "#ffc107"              # Amarelo (#ffc107) com texto preto (#000) e borda branca (#fff)
  btn_solo_active_text_color: "#000000"
  btn_solo_active_border: "#ffffff"
  btn_solo_alert_bg: "#c0000a"               # Vermelho Yamaha pulsante quando há solos ativos
  btn_solo_alert_text_color: "#ffffff"
  btn_solo_alert_border: "#ff2233"
  btn_solo_alert_glow: "0 0 10px rgba(220, 0, 10, 0.8)"
  btn_solo_height: "28px"
  btn_solo_radius: "4px"
  btn_solo_font_size: "10px"
  btn_solo_font_weight: "bold"

  # Botão PRE / POST (Sends / Auxiliares)
  btn_pre_post_bg: "#333333"
  btn_pre_post_text_color: "#888888"
  btn_pre_post_border: "#444444"
  btn_pre_post_active_bg: "#8e24aa"         # Roxo Yamaha (#8e24aa)
  btn_pre_post_active_text_color: "#ffffff"
  btn_pre_post_active_border: "#ba68c8"
  btn_pre_post_active_glow: "0 0 10px rgba(142, 36, 170, 0.5)"

  # Botão ON (Mute / Unmute)
  btn_on_bg: "#333333"
  btn_on_text_color: "#888888"
  btn_on_border: "#444444"
  btn_on_active_bg: "#ff4500"                # Laranja-avermelhado (#ff4500)
  btn_on_active_text_color: "#ffffff"
  btn_on_active_border: "#ffaa80"
  btn_on_active_glow: "0 0 15px rgba(255, 69, 0, 0.4)"
  btn_on_height: "43px"
  btn_on_radius: "4px"
  btn_on_font_size: "11px"
  btn_on_font_weight: "800"

  # Botões Nudge (+ / -)
  btn_nudge_bg: "#333333"
  btn_nudge_text_color: "#cccccc"
  btn_nudge_border: "#444444"
  btn_nudge_hover_bg: "#555555"
  btn_nudge_height: "28px"
  btn_nudge_width: "28px"
  btn_nudge_radius: "50%"
  btn_nudge_font_size: "16px"

  # Display de Valor em dB
  db_display_text_color: "#5cacee"
  db_display_font_size: "13px"
  db_display_font_weight: "bold"
  db_display_font_family: "'Arial Narrow', sans-serif"
  db_display_height: "30px"

  # Trilho e Knob do Fader
  fader_track_width: "6px"
  fader_track_bg: "#101012"
  fader_track_border: "#2a2a30"
  fader_track_radius: "3px"
  fader_knob_width: "40px"
  fader_knob_height: "40px"
  fader_knob_bg: "#eeeeee"
  fader_knob_line_color: "#000000"
  fader_knob_border: "2px solid #000000"
  fader_knob_radius: "6px"
  fader_knob_shadow: "0 4px 10px rgba(0, 0, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.2) inset"

  # VU Meter (Gradiente e LEDs de Pico)
  meter_track_width: "5px"
  meter_gradient: "linear-gradient(to top, #28a745 0%, #28a745 40%, #ffc107 50%, #dc3545 80%, #ff0000 100%)"
  peak_led_off: "#252525"
  peak_led_on: "#ff0000"
  peak_led_glow: "0 0 8px #ff4444"

  # Escala de dB (Traços laterais e marcas)
  scale_tick_color: "#555555"
  scale_tick_small_color: "#444444"
  scale_text_color: "#999999"
  scale_font_size: "8px"
  scale_font_family: "'Arial Narrow', sans-serif"

  # Barra / Indicador de Pan
  pan_height: "25px"
  pan_bg: "#0d0d0d"
  pan_border_top: "1px solid #1a1a1a"
  pan_track_bg: "#222222"
  pan_track_height: "4px"
  pan_track_radius: "2px"
  pan_tick_color: "#333333"
  pan_center_tick_color: "#3a3a3a"
  pan_label_color: "#333333"
  pan_label_font_size: "7px"
  pan_thumb_center_color: "#4a4a5a"
  pan_thumb_active_color: "#a855f7"
  pan_thumb_glow: "0 0 4px rgba(168, 85, 247, 0.5)"

  # Rodapé de Patch (Área inferior do canal)
  patch_height: "24px"
  patch_bg_input_1: "#001c2e"
  patch_text_input_1: "#0088bd"
  patch_bg_input_2: "#002417"
  patch_text_input_2: "#00b862"
  patch_bg_st_in: "#0a141f"
  patch_text_st_in: "#437fae"
  patch_bg_mix: "#181300"
  patch_text_mix: "#a67c12"
  patch_bg_bus: "#001713"
  patch_text_bus: "#008a74"
  patch_font_size: "10px"
  patch_font_weight: "800"
  patch_font_family: "'Consolas', 'Menlo', 'Courier New', monospace"

  # Estados Especiais (Disabled, Linked / Estéreo)
  disabled_opacity: "0.45"
  linked_badge_bg: "#1976d2"
  linked_badge_color: "#ffffff"


