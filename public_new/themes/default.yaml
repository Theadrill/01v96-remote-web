# ════════════════════════════════════════════════════════════════
# TEMA GLOBAL — 01V96 Remote Web
# ════════════════════════════════════════════════════════════════
#
# Este arquivo define TODAS as variáveis CSS do projeto.
# Para criar um novo tema, copie este arquivo, renomeie e edite.
#
# Estrutura por componente:
#   - confirm_modal: Modal de confirmação reutilizável
#   - sidebar:       Sidebar de navegação (futuro)
#   - faders:        Área de faders (futuro)
#   - header:        Cabeçalho (futuro)
#   - eq:            Equalizador (futuro)
#   - dynamics:      Gate/Compressor (futuro)
#
# Adicione novos componentes conforme forem sendo refatorados.
# ════════════════════════════════════════════════════════════════
# ENDOFDESCRIPTION


# ─── OVERLAY GLOBAL ───────────────────────────────────────────
# Usado por todos os modais do sistema
global:
  bg_overlay: "rgba(0, 0, 0, 0.85)"


# ─── CONFIRM MODAL ────────────────────────────────────────────
# Modal de confirmação reutilizável (ConfirmModal)
# Uso: ConfirmModal.show({ title, message, type })
confirm_modal:
  # Fundo do card
  bg_content: "#1a1a1a"
  border_color: "#333"
  border_radius: "12px"
  padding: "24px"
  max_width: "380px"

  # Tipografia
  text_primary: "#fff"
  text_secondary: "#ccc"
  text_muted: "#888"

  # Botões - Cores
  btn_primary: "#28a745"      # verde - ação positiva (SIM, CONFIRMAR)
  btn_danger: "#dc3545"       # vermelho - ação destrutiva (DELETAR)
  btn_warning: "#ffc107"      # amarelo - atenção
  btn_info: "#1976d2"         # azul - informativo
  btn_secondary: "#2b2b2b"    # cinza escuro - cancelar/voltar

  # Botões - Dimensões
  btn_height: "44px"
  btn_radius: "8px"
  btn_gap: "10px"
  btn_font_weight: "800"
  btn_letter_spacing: "0.5px"

  # Ícones
  icon_danger_color: "#dc3545"
  icon_warning_color: "#ffc107"
  icon_info_color: "#1976d2"
  icon_success_color: "#28a745"
  icon_size: "24px"

  # Z-index (sempre alto pois é última etapa do fluxo)
  z_index: "999999"


# ─── VIRTUAL KEYBOARD ─────────────────────────────────────────
# Teclado virtual reutilizável
# Uso: VirtualKeyboard.create(targetInputId) → HTMLElement
virtual_keyboard:
  # Teclas
  key_bg: "#333"
  key_border: "1px solid #555"
  key_color: "#fff"
  key_height: "40px"
  key_radius: "6px"
  key_font_size: "16px"
  key_font_weight: "bold"

  # Backspace
  backspace_bg: "#c62828"
  backspace_border: "1px solid #e53935"

  # Espaço
  space_font_size: "14px"

  # Layout
  row_gap: "4px"
  keyboard_gap: "4px"


# ─── FUTUROS COMPONENTES ──────────────────────────────────────
# Adicione novas seções conforme refatorar:
#
# sidebar:
#   ...
#
# faders:
#   ...
#
# prompt_modal:       # Modal de prompt (input)
#   ...
#
# alert_modal:        # Modal de alerta (só OK)
#   ...

# ─── BUBBLE MODAL ────────────────────────────────────────
# Balão de aviso/dica contextual
bubble_modal:
  bg_color: "#1e293b"
  border_color: "#3b82f6"
  border_radius: "8px"
  text_color: "#f8fafc"
  font_size: "13px"
  padding: "10px 14px"
  shadow: "0 10px 25px -5px rgba(0, 0, 0, 0.5)"
  z_index: "999999"
  arrow_color: "#3b82f6"
  duration: 5000 # Duração de exibição do balão em ms (ex: 5000 = 5s)
  delay: 300 # Tempo de espera em ms antes de exibir o balão (compatível com tempo de duplo clique)

# ─── CHANNEL LOCK ─────────────────────────────────────────────
# Overlay visual e comportamento de bloqueio de canal (channel_lock.js)
channel_lock:
  hold_duration_ms: 750      # Tempo em milissegundos pressionado para abrir o modal de lock (reduzido para UX mais ágil)
  z_index: 100                 # Camada de profundidade da sobreposição do lock
  icon_class: "fas fa-lock"     # Classe do ícone FontAwesome
  overlay_bg: "rgba(0, 0, 0, 0.30)"
  overlay_backdrop_filter: "blur(2px)"
  icon_color: "#000000"
  icon_size: "32px"
  border_locked: "1px solid #ff4444"
  border_color: "#ff4444"
  badge_bg: "#ff4444"
  badge_text_color: "#ffffff"

# ─── CHANNEL STRIP (FADERS & CANAIS) ──────────────────────────
# Faixas de canal, faders universais, botões ON/SOLO, grupos e medidores
channel_strip:

  # ══════════════════════════════════════════════════════════════
  # 1. PROPRIEDADES GLOBAIS (Compartilhadas por Desktop e Mobile)
  # ══════════════════════════════════════════════════════════════
  global:
    # Cores de Grupos / Barramentos
    group_1_color: "#00adef"           # Azul - Canais 1-16
    group_2_color: "#00ff88"           # Verde - Canais 17-32
    group_st_color: "#4a90e2"          # Azul suave - Entradas Estéreo (ST IN)
    group_mix_color: rgb(255, 204, 0)         # Amarelo/Dourado - MIX 1-8 Masters
    group_bus_color: "#00ffcc"         # Ciano/Teal - BUS 1-8 Masters
    group_aux_color: "#7e22ce"         # Roxo/Púrpura - Barramento AUX
    master_color: "#dc3545"            # Vermelho - Master Stereo PA

    # Cores de Fundo do Header Desktop por Grupo (OFF e ON)
    group_1_header_bg: "#003a5e"       # Fundo do cabeçalho Grupo 1 (OFF)
    group_1_header_on_bg: "#00568a"    # Fundo do cabeçalho Grupo 1 (ON)
    group_2_header_bg: "#004a30"       # Fundo do cabeçalho Grupo 2 (OFF)
    group_2_header_on_bg: "#006b41"    # Fundo do cabeçalho Grupo 2 (ON)
    group_st_header_bg: "#14283d"      # Fundo do cabeçalho ST IN (OFF)
    group_st_header_on_bg: "#1d3c5c"   # Fundo do cabeçalho ST IN (ON)
    group_mix_header_bg: "#332800"     # Fundo do cabeçalho MIX (OFF)
    group_mix_header_on_bg: "#594500"  # Fundo do cabeçalho MIX (ON)
    group_bus_header_bg: "#002e27"     # Fundo do cabeçalho BUS (OFF)
    group_bus_header_on_bg: "#005a4e"  # Fundo do cabeçalho BUS (ON)
    master_header_bg: "#4a0014"        # Fundo do cabeçalho Master (OFF)
    master_header_on_bg: "#6b1426"     # Fundo do cabeçalho Master (ON)

    # Cores de Fundo Sutil do Corpo do Canal quando ON (Desktop)
    group_1_body_on_bg: "#1a2633"       # Fundo do corpo Grupo 1 (ON)
    group_2_body_on_bg: "#1a2b22"       # Fundo do corpo Grupo 2 (ON)
    group_st_body_on_bg: "#182533"      # Fundo do corpo ST IN (ON)
    group_mix_body_on_bg: "#2b2615"     # Fundo do corpo MIX (ON)
    group_bus_body_on_bg: "#162925"     # Fundo do corpo BUS (ON)
    group_aux_body_on_bg: "#261833"     # Fundo do corpo AUX (ON)
    master_body_on_bg: "#33141a"        # Fundo do corpo Master (ON)

    # ── Font Face & Tipografia de Cada Elemento de Texto ──

    # Header / Identificação do Canal (Número / Rótulo)
    header_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    header_font_weight: "800"
    header_font_size: "11px"

    # Display OLED Digital de Nome do Canal
    name_display_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    name_display_font_weight: "700"
    name_display_font_size: "11px"
    name_display_bg: "#000000"
    name_display_color: "#00ff00"
    name_display_width: "calc(100% - 5px)"       # Largura do display LED (deixa espaço simétrico nas laterais)
    name_display_padding: "2px 2px"             # Espaçamento interno do texto no LED
    name_display_margin: "0px auto"             # Margem do display LED
    name_display_zone_padding: "1px 0px"        # Espaçamento interno da área do LED
    name_display_zone_margin: "0px"             # Margem externa da área do LED
    name_display_radius: "4px"                  # Arredondamento do visor LED

    # Botão SOLO / CUE
    btn_solo_font_family: '"Arial"'
    btn_solo_font_weight: "600"
    btn_solo_font_size: "10px"
    btn_solo_bg: "#333333"
    btn_solo_text: "#888888"
    btn_solo_active_bg: "#22c55e"
    btn_solo_active_text: "#ffffff"
    btn_solo_active_glow: "rgba(34, 197, 94, 0.45)"

    # Botão PRE / POST (Envios Auxiliares)
    btn_pre_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    btn_pre_font_weight: "800"
    btn_pre_font_size: "10px"
    btn_pre_bg: "#6b21a8"
    btn_pre_text: "#ffffff"
    btn_pre_border: "#9333ea"

    # Botão ON / MUTE
    btn_on_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    btn_on_font_weight: "900"
    btn_on_font_size: "11px"
    btn_on_bg: "#333333"
    btn_on_text: "#888888"
    btn_on_active_bg: "#ffc107"
    btn_on_active_text: "#000000"
    btn_on_active_glow: "rgba(255, 69, 0, 0.4)"

    # Botões de Nudge (+ / -)
    btn_nudge_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    btn_nudge_font_weight: "800"
    btn_nudge_font_size: "13px"
    btn_nudge_bg: "#333333"
    btn_nudge_text: "#cccccc"

    # Visor Digital de Ganho / Valor Numérico em dB (Readout)
    db_val_font_family: '"Arial Narrow", sans-serif'
    db_val_font_weight: "600"
    db_val_font_size: "13px"
    db_val_color: "#5cacee"

    # Escala e Régua Analógica em dB
    scale_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    scale_font_weight: "700"
    scale_font_size: "7.5px"
    scale_text_color: "#999999"

    # Panpot (L-C-R e Leitura Numérica)
    pan_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    pan_font_weight: "700"
    pan_font_size: "8px"
    pan_track_bg: "#222222"
    pan_thumb_color: "#a855f7"
    pan_center_color: "#4a4a5a"

    # Rodapé de Roteamento e Badge de Patch I/O
    patch_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    patch_font_weight: "800"
    patch_font_size: "10px"

    # Bloco de Medidores do Master (Feature Box)
    meters_title_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    meters_title_font_weight: "800"
    meters_title_font_size: "9px"
    meters_badge_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    meters_badge_font_weight: "800"
    meters_badge_font_size: "8.5px"
    meters_box_bg: "rgba(0, 0, 0, 0.45)"
    meters_box_border: "rgba(255, 255, 255, 0.15)"
    meters_box_radius: "4px"
    meters_badge_bg: "#1e293b"
    meters_badge_text: "#38bdf8"
    meters_badge_border: "#334155"

    # Bloco de Posição do Auxiliar (Feature Box)
    position_title_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    position_title_font_weight: "800"
    position_title_font_size: "9px"
    position_badge_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    position_badge_font_weight: "800"
    position_badge_font_size: "8.5px"
    position_box_border: "rgba(212, 175, 55, 0.4)"
    position_title_color: "#d4af37"

    # Macro Fader Técnico (Configuração, Delta dB, Big Nudges e Botão Zerar)
    macro_config_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_config_font_weight: "800"
    macro_config_font_size: "10px"
    macro_delta_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_delta_font_weight: "800"
    macro_delta_font_size: "11px"
    macro_big_nudge_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_big_nudge_font_weight: "900"
    macro_big_nudge_font_size: "24px"
    macro_reset_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_reset_font_weight: "800"
    macro_reset_font_size: "10px"

    macro_bg: "#d4d4d8"                        # Fundo prateado/cinza claro do card Macro
    macro_border: "#27272a"                    # Borda escura do card Macro
    macro_header_bg: "#3f3f46"                 # Fundo do cabeçalho do Macro
    macro_header_text: "#ffffff"               # Cor do texto do cabeçalho
    macro_title_color: "#ffffff"               # Cor do texto no visor OLED do Macro (branco puro)
    macro_title_bg: "#000000"                  # Fundo do visor OLED do Macro
    macro_config_bg: "#6b21a8"                 # Fundo do botão CONFIG (roxo escuro)
    macro_config_hover_bg: "#7e22ce"           # Hover do botão CONFIG
    macro_config_text: "#ffffff"               # Cor do texto do botão CONFIG
    macro_config_radius: "6px"                 # Arredondamento do botão CONFIG
    macro_delta_bg: "#09090b"                  # Fundo do visor OLED Delta dB
    macro_delta_text: "#00ff00"                # Texto do visor Delta dB em repouso (verde neon)
    macro_delta_active_text: "#00ff00"         # Texto do visor Delta dB ativo (verde neon)
    macro_big_nudge_bg: "#ffffff"              # Fundo do botão Big Nudge
    macro_big_nudge_text: "#000000"            # Símbolo (+/-) do Big Nudge
    macro_big_nudge_border: "#a1a1aa"          # Borda do botão Big Nudge
    macro_big_nudge_radius: "12px"             # Arredondamento dos Big Nudges gigantes
    macro_big_nudge_shadow: "0 3px 6px rgba(0,0,0,0.15)" # Sombra 3D dos Big Nudges
    macro_reset_bg: "#dc2626"                  # Fundo vermelho do botão ZERAR
    macro_reset_hover_bg: "#ef4444"            # Hover do botão ZERAR
    macro_reset_text: "#ffffff"                # Texto do botão ZERAR
    macro_reset_radius: "6px"                  # Arredondamento do botão ZERAR

    # Medidores e LED de Pico
    peak_led_color: "#ff0000"                  # Cor do LED de Peak aceso
    peak_led_glow: "#ff4444"                   # Brilho do LED de Peak aceso
    fader_track_color: "#555555"               # Cor da linha central do trilho do fader

    # Canal Travado (Channel Lock)
    lock_border_color: "#ff4444"               # Borda vermelha de canal travado
    lock_badge_bg: "#ff4444"                   # Fundo do badge de cadeado
    lock_badge_text: "#ffffff"                 # Ícone do cadeado
    lock_overlay_bg: "rgba(0, 0, 0, 0.58)"     # Fundo escurecido (dim) do overlay de bloqueio

    # Canal Desabilitado / FIXED
    disabled_opacity: "0.45"                   # Opacidade reduzida para controles desabilitados
    disabled_filter: "grayscale(80%)"          # Desaturação de controles inativos

  # ══════════════════════════════════════════════════════════════
  # 2. PROPRIEDADES DESKTOP (Dimensões e Estilos Exclusivos)
  # ══════════════════════════════════════════════════════════════
  desktop:
    card_width: "86px"                         # Largura de cada canal no modo desktop (86px)
    card_paired_width: "108px"                 # Largura de canais estéreo pareados no desktop (108px)
    card_bg: rgb(34, 34, 34)                  # Fundo do card desktop
    card_border: "#222222"                     # Cor da borda base do card
    card_border_width: "1px"                   # Espessura da borda base do card
    desk_card_border: "#333333"                # Cor da borda dos cards no Desktop (superior, inferior e extremidades)
    desk_card_border_width: "1px"              # Espessura da borda dos cards no Desktop
    desk_card_divider: "1px solid #111111"     # Divisor fino entre canais colados no Desktop
    card_radius: "0px"                         # Arredondamento do card
    card_on_bg: "rgba(255, 69, 0, 0.08)"       # Fundo sutil de destaque quando o canal está ON
    header_height: "26px"                      # Altura do cabeçalho desktop
    patch_height: "23px"                       # Altura do rodapé de patch desktop

    # Botões - Dimensões Físicas Desktop
    btn_on_height: "40px"                      # Altura do botão ON no desktop
    btn_on_radius: "4px"                       # Arredondamento do botão ON no desktop
    btn_solo_height: "28px"                    # Altura do botão SOLO no desktop
    btn_solo_radius: "4px"                     # Arredondamento do botão SOLO no desktop
    btn_pre_height: "18px"                     # Altura do botão PRE/POST no desktop
    btn_pre_radius: "4px"                      # Arredondamento do botão PRE/POST no desktop
    btn_nudge_size: "22px"                     # Tamanho / altura dos botões de nudge no desktop
    btn_nudge_radius: "50%"                    # Arredondamento dos botões de nudge no desktop
    macro_config_btn_height: "40px"            # Altura do botão CONFIG (Macro Fader no desktop - mesmo tamanho do ON: 40px)
    macro_reset_btn_height: "24px"             # Altura do botão ZERAR (Macro Fader)
    name_display_radius: "0px"                 # Arredondamento da caixa de nome no desktop
    volume_geral_width: "70px"                 # Largura mais fina específica para Volume Geral (70px)

  # ══════════════════════════════════════════════════════════════
  # 3. PROPRIEDADES MOBILE (Dimensões e Controles Táteis)
  # ══════════════════════════════════════════════════════════════
  mobile:
    card_width: "118px"                        # Largura generosa do card no layout mobile (118px)
    card_paired_width: "148px"                 # Largura para canais pareados no mobile (148px)
    volume_geral_width: "70px"                 # Largura do Volume Geral no mobile (70px)
    card_radius: "12px"                        # Arredondamento do card mobile
    card_border: "#282828"                     # Cor da borda do contorno do card mobile
    card_border_width: "1px"                   # Espessura da borda do contorno do card mobile
    card_border_top_width: "3px"               # Espessura da borda superior cromática de grupo no mobile
    strip_bg: "#14161d"                        # Fundo padrão do card mobile (cor do fundo geral do strip mobile)

    header_height: "30px"                      # Altura do cabeçalho mobile
    header_font_size: "13px"                   # Tamanho da fonte do cabeçalho mobile
    header_font_weight: "800"                  # Peso da fonte do cabeçalho mobile
    header_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'

    # Botões - Alturas e Dimensões Mobile
    btn_on_height: "38px"                      # Altura do botão ON no mobile (38px)
    btn_on_font_size: "12px"                   # Tamanho da fonte do botão ON mobile
    btn_on_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    btn_solo_height: "38px"                    # Altura do botão SOLO no mobile (38px)
    btn_solo_font_size: "11px"                 # Tamanho da fonte do botão SOLO mobile
    btn_solo_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    btn_pre_height: "38px"                     # Altura do botão PRE/POST no mobile (38px)
    btn_pre_font_size: "11px"                  # Tamanho da fonte do botão PRE/POST mobile
    btn_pre_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    btn_medidores_height: "38px"               # Altura do botão MEDIDORES / POSIÇÃO no mobile (38px)
    btn_radius: "6px"                          # Arredondamento dos botões ON/SOLO/PRE/MEDIDORES mobile
    nudge_btn_size: "50px"                     # Tamanho aumentado dos botões de nudge (+50%: 50px)
    nudge_font_size: "24px"                    # Tamanho do símbolo de nudge mobile
    nudge_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_config_btn_height: "28px"            # Altura do botão CONFIG (Macro Mobile)
    macro_config_font_size: "12px"             # Tamanho da fonte do botão CONFIG mobile
    macro_config_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_reset_btn_height: "28px"             # Altura do botão ZERAR (Macro Mobile)
    macro_reset_font_size: "12px"              # Tamanho da fonte do botão ZERAR mobile
    macro_reset_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'

    db_font_size: "18px"                       # Tamanho da fonte do valor em dB (+50%: 18px)
    db_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    name_display_font_size: "13px"             # Tamanho da fonte do nome do canal no Mobile
    name_display_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif' # Tipografia do nome no Mobile
    scale_font_size: "8.5px"                   # Tamanho da régua mobile
    scale_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
    macro_big_nudge_font_size: "28px"          # Tamanho dos big nudges mobile
    fader_thumb_width: "58px"                  # Largura do fader thumb mobile (+25%)
    fader_thumb_height: "48px"                 # Altura do fader thumb mobile (+25%)
    fader_thumb_radius: "7px"                  # Arredondamento do fader thumb mobile

    # Gradiente da cortina do VU Meter mobile
    meter_gradient_top: "#ff0000"              # Vermelho - topo do gradiente (clipe)
    meter_gradient_mid: "#ffbb00"              # Amarelo - meio do gradiente (quase no clip)
    meter_gradient_low: "#166534"              # Verde escuro - faixa intermediária
    meter_gradient_base: "#064e3b"             # Verde muito escuro - base do medidor


# ─── MAIN VIEW (TELA PRINCIPAL DO MIXER) ──────────────────────
# Layout da visão principal do mixer (CH 1-32, ST IN, Macro, Master PA)
main_view:
  faders_gap: "0px"                          # Espaçamento padrão entre canais desktop
  faders_padding: "1px"                      # Padding interno da área de faders
  group_separator_width: "6px"               # Largura do separador de grupos
  group_separator_bg: "transparent"          # Cor de fundo do separador
  macro_spacer_width: "55px"                 # Largura do espaçador do Macro Fader
  macro_spacer_bg: "transparent"             # Fundo do espaçador do Macro Fader
  mobile_faders_gap: "12px"                  # Espaçamento entre canais no mobile (aumentado para 12px)
  mobile_group_gap: "24px"                   # Espaçamento maior a cada 8 canais no mobile (aumentado para 24px)


# ─── CHANNEL SETUP (CENTRAL DE EDIÇÃO DO CANAL) ──────────────
# Modal de edição detalhada (EQ, Dinâmica, Auxiliares, Inserts, Roteamento)
channel_setup:
  overlay_bg: "#000000"                      # Fundo totalmente preto do modal
  modal_bg: "#000000"                        # Fundo principal do modal (preto sólido)
  modal_border: "#262936"                    # Borda do modal
  modal_radius: "8px"                        # Arredondamento do modal
  header_bg: "#181b24"                       # Fundo do cabeçalho de navegação
  header_text: "#ffffff"                     # Cor do título do canal
  header_font_family: '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
  header_font_size: "14px"                   # Tamanho da fonte do título
  nav_btn_bg: "#202533"                      # Fundo dos botões de navegação ◀ ▶
