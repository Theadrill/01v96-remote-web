# Visão principal — espaçamento entre faders, separadores de grupo e modo mobile
main_view:
  faders_gap: 0px
  faders_padding: 1px
  group_separator_width: 6px
  group_separator_bg: transparent
  macro_spacer_width: 55px
  macro_spacer_bg: transparent
  mobile_faders_gap: 12px
  mobile_group_gap: 24px
# Setup de canal — modal de configuração, abas de navegação e mini-fader
