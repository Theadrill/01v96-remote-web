# Configurações globais de sobreposição e fundo geral da interface
global:
  bg_overlay: rgba(0, 0, 0, 0.85)
# Modal de confirmação — botões de ação, tipografia e cores de status
confirm_modal:
  bg_content: '#1a1a1a'
  border_color: '#333'
  border_radius: 12px
  padding: 24px
  max_width: 380px
  text_primary: '#fff'
  text_secondary: '#ccc'
  text_muted: '#888'
  btn_primary: '#28a745'
  btn_danger: '#dc3545'
  btn_warning: '#ffc107'
  btn_info: '#1976d2'
  btn_secondary: '#2b2b2b'
  btn_height: 44px
  btn_radius: 8px
  btn_gap: 10px
  btn_font_weight: '800'
  btn_letter_spacing: 0.5px
  icon_danger_color: '#dc3545'
  icon_warning_color: '#ffc107'
  icon_info_color: '#1976d2'
  icon_success_color: '#28a745'
  icon_size: 24px
  z_index: '999999'
# Teclado virtual — aparência das teclas, espaçamento e cores de destaque
virtual_keyboard:
  key_bg: '#333'
  key_border: '1px solid #555'
  key_color: '#fff'
  key_height: 40px
  key_radius: 6px
  key_font_size: 16px
  key_font_weight: bold
  backspace_bg: '#c62828'
  backspace_border: '1px solid #e53935'
  space_font_size: 14px
  row_gap: 4px
  keyboard_gap: 4px
# Bubble modal — tooltip flutuante com seta, cores e animação de duração
bubble_modal:
  bg_color: '#1e293b'
  border_color: '#3b82f6'
  border_radius: 8px
  text_color: '#f8fafc'
  font_size: 13px
  padding: 10px 14px
  shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5)
  z_index: '999999'
  arrow_color: '#3b82f6'
  duration: 5000
  delay: 300
# Trava de canal — overlay de bloqueio, ícone, badge e comportamento de hold
channel_lock:
  hold_duration_ms: 750
  z_index: 100
  icon_class: fas fa-lock
  overlay_bg: rgba(0, 0, 0, 0.30)
  overlay_backdrop_filter: blur(2px)
  icon_color: '#000000'
  icon_size: 32px
  border_locked: '1px solid #ff4444'
  border_color: '#ff4444'
  badge_bg: '#ff4444'
  badge_text_color: '#ffffff'
# Channel strip — cores de grupo, tipografia, botões, metros e faders (global/desktop/mobile)
